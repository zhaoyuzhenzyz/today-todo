<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>今日待办</title>
<style>
  :root {
    --bg: #08090B;
    --bg-glow-1: rgba(77, 141, 255, 0.10);
    --bg-glow-2: rgba(124, 92, 255, 0.07);
    --surface: #101216;
    --surface-2: #161920;
    --surface-3: #1C2029;
    --border: rgba(255, 255, 255, 0.075);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #EDEFF3;
    --text-2: #A2A9B4;
    --text-3: #666E7B;
    --accent: #4D8DFF;
    --accent-2: #6FA5FF;
    --accent-soft: rgba(77, 141, 255, 0.13);
    --danger: #FF6B6B;
    --danger-soft: rgba(255, 107, 107, 0.12);
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.85);
    --inset: inset 0 1px 0 rgba(255, 255, 255, 0.045);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-full: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }

  html[data-theme="light"] {
    --bg: #F6F7F9;
    --bg-glow-1: rgba(77, 141, 255, 0.13);
    --bg-glow-2: rgba(124, 92, 255, 0.08);
    --surface: #FFFFFF;
    --surface-2: #F4F6F9;
    --surface-3: #EDF0F5;
    --border: rgba(15, 22, 36, 0.09);
    --border-strong: rgba(15, 22, 36, 0.16);
    --text: #101319;
    --text-2: #5C6472;
    --text-3: #949CAA;
    --accent: #2F6BE0;
    --accent-2: #2F6BE0;
    --accent-soft: rgba(47, 107, 224, 0.10);
    --danger: #D93B3B;
    --danger-soft: rgba(217, 59, 59, 0.09);
    --shadow: 0 24px 60px -26px rgba(16, 24, 40, 0.28);
    --inset: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 4vw, 56px) clamp(14px, 4vw, 32px);
    position: relative;
    overflow-x: hidden;
    transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 520px; height: 520px;
    top: -220px; left: 50%;
    transform: translateX(-62%);
    background: var(--bg-glow-1);
  }
  body::after {
    width: 460px; height: 460px;
    bottom: -260px; left: 50%;
    transform: translateX(-18%);
    background: var(--bg-glow-2);
  }

  .shell {
    width: 100%;
    max-width: 620px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- Header ---------- */
  header.top { padding: 2px 4px 0; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 10px;
  }
  .eyebrow .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: clamp(26px, 5.6vw, 34px);
    font-weight: 620;
    letter-spacing: -0.025em;
    line-height: 1.15;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  .icon-btn {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease),
                background-color .2s var(--ease), transform .2s var(--ease);
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--surface-2);
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  /* ---------- Composer ---------- */
  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 8px 8px 8px 14px;
    box-shadow: var(--shadow), var(--inset);
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    position: relative;
  }
  .composer:focus-within {
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft), var(--inset);
  }
  .composer.invalid { animation: nudge .34s var(--ease); border-color: var(--danger); }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    60% { transform: translateX(4px); }
  }

  .composer .plus {
    flex: none;
    color: var(--text-3);
    display: grid; place-items: center;
  }
  .composer .plus svg { width: 17px; height: 17px; }

  #input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 8px 0;
  }
  #input::placeholder { color: var(--text-3); }

  .add-btn {
    flex: none;
    border: 0;
    cursor: pointer;
    border-radius: 12px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 560;
    letter-spacing: 0.01em;
    color: #fff;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow: 0 6px 16px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.22);
    transition: transform .16s var(--ease), filter .2s var(--ease), opacity .2s var(--ease);
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: scale(0.96); }
  .add-btn:disabled { opacity: 0.42; cursor: not-allowed; filter: none; }

  /* ---------- Progress ---------- */
  .progress {
    height: 2px;
    border-radius: var(--r-full);
    background: var(--border);
    overflow: hidden;
    margin: -4px 4px 0;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .5s var(--ease);
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
    flex-wrap: wrap;
  }

  .filters {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
  }
  .filters button {
    border: 0;
    cursor: pointer;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: var(--r-full);
    transition: color .18s var(--ease), background-color .18s var(--ease);
  }
  .filters button:hover { color: var(--text); }
  .filters button[aria-selected="true"] {
    color: var(--text);
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(0,0,0,.28), var(--inset);
  }

  .counter {
    font-size: 12.5px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .counter b {
    color: var(--accent);
    font-weight: 620;
    font-size: 14px;
  }
  .counter .muted { color: var(--text-3); }
  .counter .sep {
    width: 1px;
    height: 9px;
    background: var(--border-strong);
    display: inline-block;
    margin: 0 7px;
    transform: translateY(1px);
  }

  /* ---------- List ---------- */
  .list-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow), var(--inset);
    overflow: hidden;
  }

  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background-color .18s var(--ease);
    will-change: transform, opacity;
  }
  li.item:last-child { border-bottom: 0; }
  li.item:hover { background: var(--surface-2); }

  .check {
    flex: none;
    width: 20px; height: 20px;
    margin-top: 1.5px;
    border-radius: 6px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    padding: 0;
    transition: border-color .2s var(--ease), background-color .2s var(--ease),
                transform .16s var(--ease);
  }
  .check:hover { border-color: var(--accent); }
  .check:active { transform: scale(0.9); }
  .check svg {
    width: 13px; height: 13px;
    stroke: #fff;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 22;
    stroke-dashoffset: 22;
    transition: stroke-dashoffset .3s var(--ease) .04s;
  }
  li.item.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }
  li.item.done .check svg { stroke-dashoffset: 0; }

  .task {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: anywhere;
    transition: color .25s var(--ease), opacity .25s var(--ease);
    padding-top: 1px;
    cursor: text;
    border-radius: 5px;
  }
  li.item.done .task {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--text-3);
  }

  /* ---------- 行内编辑 ---------- */
  li.item.editing { background: var(--surface-2); }
  li.item.editing .task,
  li.item.editing .edit-btn,
  li.item.editing .del { display: none; }

  .edit-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 7px;
    padding: 2px 8px;
    margin: -3px 0;
    outline: 0;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .row-actions {
    flex: none;
    display: flex;
    align-items: center;
    gap: 1px;
    margin-top: -1px;
  }

  .edit-btn,
  .del {
    flex: none;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity .18s var(--ease), color .18s var(--ease), background-color .18s var(--ease);
  }
  .edit-btn svg { width: 13px; height: 13px; }
  .del svg { width: 14px; height: 14px; }

  li.item:hover .edit-btn,
  li.item:hover .del,
  .edit-btn:focus-visible,
  .del:focus-visible { opacity: 1; }
  .edit-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .del:hover { color: var(--danger); background: var(--danger-soft); }

  /* 触屏或无 hover 能力的设备上常驻显示，避免无法编辑/删除 */
  @media (hover: none), (pointer: coarse) {
    .edit-btn,
    .del { opacity: 0.62; }
  }

  /* ---------- Empty ---------- */
  .empty {
    padding: 46px 24px;
    text-align: center;
  }
  .empty .glyph {
    width: 44px; height: 44px;
    margin: 0 auto 14px;
    display: grid; place-items: center;
    border-radius: 14px;
    border: 1px dashed var(--border-strong);
    color: var(--text-3);
  }
  .empty .glyph svg { width: 19px; height: 19px; }
  .empty p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-2);
  }
  .empty span {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: var(--text-3);
  }

  /* ---------- Footer ---------- */
  footer.foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 2px 4px 0;
    font-size: 12px;
    color: var(--text-3);
    min-height: 24px;
  }
  .clear-done {
    border: 0;
    background: transparent;
    color: var(--text-3);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 3px 6px;
    margin: -3px -6px;
    border-radius: 6px;
    transition: color .18s var(--ease), background-color .18s var(--ease);
    opacity: 0;
    pointer-events: none;
  }
  .clear-done.show { opacity: 1; pointer-events: auto; }
  .clear-done:hover { color: var(--danger); background: var(--danger-soft); }

  .hint kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1.5px 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  @media (max-width: 480px) {
    .add-btn { padding: 9px 13px; }
    li.item { padding: 12px 12px; gap: 10px; }
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="eyebrow"><span class="dot"></span>Daily Focus</div>
      <div class="title-row">
        <div>
          <h1>今日待办</h1>
          <div class="subtitle" id="subtitle">—</div>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色主题" title="切换主题">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <form class="composer" id="composer" autocomplete="off">
      <span class="plus" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <label class="sr-only" for="input">新增任务</label>
      <input id="input" type="text" placeholder="添加一件今天要做的事…" maxlength="200" />
      <button class="add-btn" id="addBtn" type="submit">添加</button>
    </form>

    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="筛选任务">
        <button type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
        <button type="button" role="tab" data-filter="active" aria-selected="false">未完成</button>
        <button type="button" role="tab" data-filter="done" aria-selected="false">已完成</button>
      </div>
      <div class="counter" id="counter" aria-live="polite"></div>
    </div>

    <div class="list-wrap">
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <div class="glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7.5h16M4 12h10M4 16.5h7"/>
          </svg>
        </div>
        <p id="emptyTitle">今天还很干净</p>
        <span id="emptyDesc">在上方输入框写下第一件事，回车即可添加</span>
      </div>
    </div>

    <footer class="foot">
      <button class="clear-done" id="clearDone" type="button">清除已完成</button>
      <span class="hint"><kbd>Enter</kbd> 添加 · 双击标题可编辑 · <kbd>Esc</kbd> 清空/取消</span>
    </footer>
  </main>

<script>
(function () {
  "use strict";

  var STORE_KEY = "today-todo.v1";
  var THEME_KEY = "today-todo.theme";

  var els = {
    form: document.getElementById("composer"),
    input: document.getElementById("input"),
    list: document.getElementById("list"),
    empty: document.getElementById("empty"),
    emptyTitle: document.getElementById("emptyTitle"),
    emptyDesc: document.getElementById("emptyDesc"),
    counter: document.getElementById("counter"),
    progressBar: document.getElementById("progressBar"),
    subtitle: document.getElementById("subtitle"),
    clearDone: document.getElementById("clearDone"),
    themeBtn: document.getElementById("themeBtn"),
    themeIcon: document.getElementById("themeIcon")
  };

  var state = {
    items: [],
    filter: "all"
  };

  var nodes = new Map(); // id -> li element

  // 记录当前正在编辑的行，保证同时只有一处处于编辑态
  var editingId = null;

  /* ---------------- Storage ---------------- */

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (it) {
          return it && typeof it.text === "string" && it.text.trim() !== "";
        })
        .map(function (it) {
          return {
            id: String(it.id || makeId()),
            text: String(it.text).slice(0, 200),
            done: Boolean(it.done),
            createdAt: Number(it.createdAt) || Date.now()
          };
        });
    } catch (err) {
      return [];
    }
  }

  function saveItems() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.items));
    } catch (err) {
      /* 存储不可用（隐私模式/配额满）时静默降级为内存态 */
    }
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------------- Helpers ---------------- */

  function fmtDate(d) {
    var week = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · " + week[d.getDay()];
  }

  function visibleItems() {
    if (state.filter === "active") return state.items.filter(function (i) { return !i.done; });
    if (state.filter === "done") return state.items.filter(function (i) { return i.done; });
    return state.items;
  }

  /* ---------------- Rendering ---------------- */

  var CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4 6.2 11.4 12.8 4.6"/></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>' +
                  '<path d="M6.5 7l.8 11.1A1.9 1.9 0 0 0 9.2 20h5.6a1.9 1.9 0 0 0 1.9-1.9L17.5 7"/></svg>';
  var PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                   '<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0 0-3L17 5a2.1 2.1 0 0 0-3 0L3.5 15.5V20z"/>' +
                   '<path d="M13.5 6.5l4 4"/></svg>';

  function createRow(item) {
    var li = document.createElement("li");
    li.className = "item" + (item.done ? " done" : "");
    li.dataset.id = item.id;

    var check = document.createElement("button");
    check.type = "button";
    check.className = "check";
    check.setAttribute("role", "checkbox");
    check.setAttribute("aria-checked", item.done ? "true" : "false");
    check.setAttribute("aria-label", (item.done ? "取消完成：" : "标记完成：") + item.text);
    check.innerHTML = CHECK_SVG;

    var span = document.createElement("span");
    span.className = "task";
    span.textContent = item.text;
    span.title = "双击编辑";
    span.setAttribute("role", "button");
    span.setAttribute("tabindex", "0");
    span.setAttribute("aria-label", "编辑：" + item.text);

    var actions = document.createElement("div");
    actions.className = "row-actions";

    var edit = document.createElement("button");
    edit.type = "button";
    edit.className = "edit-btn";
    edit.setAttribute("aria-label", "编辑：" + item.text);
    edit.title = "编辑";
    edit.innerHTML = PENCIL_SVG;

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.setAttribute("aria-label", "删除：" + item.text);
    del.title = "删除";
    del.innerHTML = TRASH_SVG;

    actions.appendChild(edit);
    actions.appendChild(del);

    li.appendChild(check);
    li.appendChild(span);
    li.appendChild(actions);
    return li;
  }

  function renderList(animateIds) {
    var items = visibleItems();
    els.list.textContent = "";
    nodes.clear();
    // 全量重建后旧的编辑态已不存在
    editingId = null;

    items.forEach(function (item) {
      var li = createRow(item);
      nodes.set(item.id, li);
      els.list.appendChild(li);
      if (animateIds && animateIds.indexOf(item.id) !== -1 && li.animate) {
        li.animate(
          [
            { opacity: 0, transform: "translateY(-8px) scale(0.985)" },
            { opacity: 1, transform: "translateY(0) scale(1)" }
          ],
          { duration: 300, easing: "cubic-bezier(0.22,1,0.36,1)" }
        );
      }
    });

    updateEmptyState();
  }

  function updateEmptyState() {
    var items = visibleItems();
    var hasAny = state.items.length > 0;
    var showEmpty = items.length === 0;

    els.empty.hidden = !showEmpty;
    if (showEmpty) {
      if (!hasAny) {
        els.emptyTitle.textContent = "今天还很干净";
        els.emptyDesc.textContent = "在上方输入框写下第一件事，回车即可添加";
      } else if (state.filter === "active") {
        els.emptyTitle.textContent = "全部完成了";
        els.emptyDesc.textContent = "今天的事项已经清空，可以收工了";
      } else if (state.filter === "done") {
        els.emptyTitle.textContent = "还没有完成的事项";
        els.emptyDesc.textContent = "勾选任意任务后，它会出现在这里";
      }
    }
  }

  function updateMeta() {
    var total = state.items.length;
    var done = state.items.filter(function (i) { return i.done; }).length;
    var remain = total - done;

    els.counter.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = String(remain);
    var label = document.createElement("span");
    label.textContent = "项剩余";
    els.counter.appendChild(b);
    els.counter.appendChild(label);
    if (total > 0) {
      var sep = document.createElement("span");
      sep.className = "sep";
      sep.setAttribute("aria-hidden", "true");
      var mark = document.createElement("span");
      mark.className = "muted";
      mark.textContent = "共 " + total + " 项";
      els.counter.appendChild(sep);
      els.counter.appendChild(mark);
    }

    var pct = total === 0 ? 0 : Math.round((done / total) * 100);
    els.progressBar.style.width = pct + "%";

    els.clearDone.classList.toggle("show", done > 0);
    els.clearDone.disabled = done === 0;
  }

  function renderAll(animateIds) {
    renderList(animateIds);
    updateMeta();
  }

  /* ---------------- 行内编辑 ---------------- */

  function endEditing(commit) {
    if (!editingId) return;
    var id = editingId;
    editingId = null;

    var li = nodes.get(id);
    var item = state.items.find(function (i) { return i.id === id; });
    if (!li || !item) { renderList(); return; }

    var input = li.querySelector(".edit-input");
    var raw = input ? input.value : "";
    var text = raw.trim();

    if (commit && text && text !== item.text) {
      // 保存修改
      item.text = text.slice(0, 200);
      saveItems();

      var span = li.querySelector(".task");
      if (span) {
        span.textContent = item.text;
        span.title = "双击编辑";
        span.setAttribute("aria-label", "编辑：" + item.text);
      }
      var check = li.querySelector(".check");
      if (check) {
        check.setAttribute("aria-label", (item.done ? "取消完成：" : "标记完成：") + item.text);
      }
      var editBtn = li.querySelector(".edit-btn");
      if (editBtn) editBtn.setAttribute("aria-label", "编辑：" + item.text);
      var delBtn = li.querySelector(".del");
      if (delBtn) delBtn.setAttribute("aria-label", "删除：" + item.text);

      li.classList.remove("editing");
      if (input) input.remove();
    } else if (commit && !text) {
      // 清空内容视为删除该条
      li.classList.remove("editing");
      if (input) input.remove();
      removeTask(id);
      return;
    } else {
      // 取消编辑，恢复原文
      li.classList.remove("editing");
      if (input) input.remove();
    }

    els.input.focus();
  }

  function startEditing(id) {
    if (editingId === id) return;
    // 有其它行在编辑时，先提交那一行
    if (editingId) endEditing(true);

    var li = nodes.get(id);
    var item = state.items.find(function (i) { return i.id === id; });
    if (!li || !item) return;

    editingId = id;
    li.classList.add("editing");

    var input = document.createElement("input");
    input.type = "text";
    input.className = "edit-input";
    input.value = item.text;
    input.maxLength = 200;
    input.setAttribute("aria-label", "编辑任务内容");

    // 插到标题位置
    var span = li.querySelector(".task");
    li.insertBefore(input, span);

    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    var settled = false;

    function commitOnce(commit) {
      if (settled) return;
      settled = true;
      endEditing(commit);
    }

    input.addEventListener("keydown", function (e) {
      e.stopPropagation();
      if (e.key === "Enter") {
        e.preventDefault();
        commitOnce(true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        commitOnce(false);
      }
    });

    input.addEventListener("blur", function () {
      // 失焦即保存，符合就地编辑的直觉
      commitOnce(true);
    });
  }

  /* ---------------- Actions ---------------- */

  function addTask(raw) {
    var text = (raw || "").trim();
    if (!text) {
      els.form.classList.remove("invalid");
      void els.form.offsetWidth;
      els.form.classList.add("invalid");
      els.input.focus();
      return false;
    }

    // 新增前先落定未提交的编辑
    if (editingId) endEditing(true);

    var item = { id: makeId(), text: text.slice(0, 200), done: false, createdAt: Date.now() };
    state.items.unshift(item);
    saveItems();

    if (state.filter === "done") {
      setFilter("all", true);
    } else {
      var li = createRow(item);
      nodes.set(item.id, li);
      els.list.insertBefore(li, els.list.firstChild);
      if (li.animate) {
        li.animate(
          [
            { opacity: 0, transform: "translateY(-8px) scale(0.985)" },
            { opacity: 1, transform: "translateY(0) scale(1)" }
          ],
          { duration: 300, easing: "cubic-bezier(0.22,1,0.36,1)" }
        );
      }
      updateEmptyState();
      updateMeta();
    }

    els.input.value = "";
    els.input.focus();
    return true;
  }

  function toggleTask(id) {
    var item = state.items.find(function (i) { return i.id === id; });
    if (!item) return;
    item.done = !item.done;
    saveItems();

    var li = nodes.get(id);
    if (li) {
      li.classList.toggle("done", item.done);
      var check = li.querySelector(".check");
      if (check) check.setAttribute("aria-checked", item.done ? "true" : "false");
    }

    updateMeta();

    // 在筛选视图中，勾选后该条可能不再属于当前视图
    var stillVisible = visibleItems().some(function (i) { return i.id === id; });
    if (!stillVisible && li) {
      if (li.animate) {
        li.animate(
          [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(14px)" }],
          { duration: 200, easing: "ease-out" }
        ).onfinish = function () { renderList(); };
        // 兜底：若动画被中断也要重绘
        setTimeout(function () {
          if (nodes.get(id) === li) renderList();
        }, 260);
      } else {
        renderList();
      }
    }
  }

  function removeTask(id) {
    var index = state.items.findIndex(function (i) { return i.id === id; });
    if (index === -1) return;

    // 删除正在编辑的行时先退出编辑态，避免悬空输入框
    if (editingId === id) editingId = null;

    state.items.splice(index, 1);
    saveItems();

    var li = nodes.get(id);
    nodes.delete(id);

    if (li && li.animate) {
      li.style.overflow = "hidden";
      var h = li.getBoundingClientRect().height;
      li.animate(
        [
          { opacity: 1, height: h + "px", transform: "translateX(0)", paddingTop: "13px", paddingBottom: "13px" },
          { opacity: 0, height: "0px", transform: "translateX(18px)", paddingTop: "0px", paddingBottom: "0px" }
        ],
        { duration: 240, easing: "cubic-bezier(0.4,0,1,1)", fill: "forwards" }
      ).onfinish = function () {
        li.remove();
        updateEmptyState();
      };
      setTimeout(function () {
        if (li.isConnected) { li.remove(); updateEmptyState(); }
      }, 320);
    } else if (li) {
      li.remove();
      updateEmptyState();
    }

    updateMeta();
  }

  function clearCompleted() {
    var doneIds = state.items.filter(function (i) { return i.done; }).map(function (i) { return i.id; });
    if (!doneIds.length) return;
    doneIds.forEach(removeTask);
  }

  function setFilter(filter, silent) {
    // 切换筛选会重建列表，先落定编辑
    if (editingId) endEditing(true);
    state.filter = filter;
    Array.prototype.forEach.call(document.querySelectorAll(".filters button"), function (btn) {
      btn.setAttribute("aria-selected", btn.dataset.filter === filter ? "true" : "false");
    });
    renderList();
  }

  /* ---------------- Theme ---------------- */

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    els.themeIcon.innerHTML = theme === "dark"
      ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>'
      : '<path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5 8.6 8.6 0 1 0 20.5 14.4z"/>';
    try { localStorage.setItem(THEME_KEY, theme); } catch (err) {}
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
    // 默认呈现深色工程风；用户手动切换后以其选择为准
    applyTheme(saved === "light" || saved === "dark" ? saved : "dark");
  }

  /* ---------------- Events ---------------- */

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    addTask(els.input.value);
  });

  els.input.addEventListener("input", function () {
    els.form.classList.remove("invalid");
  });

  els.input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      els.input.value = "";
      els.form.classList.remove("invalid");
    }
  });

  els.list.addEventListener("click", function (e) {
    var check = e.target.closest(".check");
    if (check) {
      var li = check.closest("li.item");
      if (li) toggleTask(li.dataset.id);
      return;
    }
    var editBtn = e.target.closest(".edit-btn");
    if (editBtn) {
      var erow = editBtn.closest("li.item");
      if (erow) startEditing(erow.dataset.id);
      return;
    }
    var del = e.target.closest(".del");
    if (del) {
      var row = del.closest("li.item");
      if (row) removeTask(row.dataset.id);
    }
  });

  // 双击标题进入编辑
  els.list.addEventListener("dblclick", function (e) {
    var task = e.target.closest(".task");
    if (!task) return;
    var li = task.closest("li.item");
    if (li) startEditing(li.dataset.id);
  });

  // 键盘可达：标题聚焦后按 Enter 或 F2 进入编辑
  els.list.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== "F2") return;
    var task = e.target.closest && e.target.closest(".task");
    if (!task) return;
    e.preventDefault();
    e.stopPropagation();
    var li = task.closest("li.item");
    if (li) startEditing(li.dataset.id);
  });

  document.querySelector(".filters").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-filter]");
    if (btn) setFilter(btn.dataset.filter);
  });

  els.clearDone.addEventListener("click", clearCompleted);

  els.themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // 跨标签页同步
  window.addEventListener("storage", function (e) {
    if (e.key === STORE_KEY) {
      state.items = loadItems();
      renderAll();
      updateMeta();
    }
  });

  /* ---------------- Boot ---------------- */

  function init() {
    initTheme();
    els.subtitle.textContent = fmtDate(new Date());
    state.items = loadItems();
    renderAll();
    els.input.focus();
  }

  init();
})();
</script>
</body>
</html>
